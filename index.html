<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ajuste automatico responsivo -->
    <link rel="stylesheet" href="assets/styles/bootstrap.css">
    <link rel="stylesheet" href="assets/styles/tienda.css">
</head>
<body>

    <header>
        <h1>Cafetería Portales</h1>
        <br>
    </header>

    <!-- barra de navegacion -->

    <nav>
        <a href="" class="btn btn-primary">Productos</a>
        <a href="" class="btn btn-primary">Promociones</a>
        <a href="" class="btn btn-primary">Contacto</a>

    </nav>
    <br>
<main>
    <section class="contenedor">
        <!-- tarjeta 1 Producto individual -->
         <article class="card">
            <img src="assets/img/cafe-torta.png" alt="mouse.jpg" width="180" height="150">
            <h2>Dulce tentación</h2>
            <p>Café más trozo de Torta</p>
            <h3>$3.500 CLP</h3>

            <button>Encargar</button>

        <!-- tarjeta 2 Producto individual -->
         <article class="card">
            <img src="assets/img/teclado.jpg" alt="teclado.jpg" width="200" height="150">

            <p>Teclado pulento</p>
            <h3>$40.000 CLP</h3>

            <button>Comprar</button>
         </article>
   
        <!-- tarjeta 3 Producto individual -->
         <article class="card">
            <img src="assets/img/audifonos.jpg" alt="audifonos.jpg" width="150" height="150">
            <h2>Audifonos</h2>
            <p>Cero Delay</p>
